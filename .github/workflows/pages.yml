# Publishes examples/ (the studio, the mesh demo, the auth demo) to GitHub Pages
# on every push to main. Enable Pages once in the repo settings: Source = GitHub Actions.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/gen-data.mjs
      - run: cp examples/studio.html examples/index.html.studio && mv examples/index.html examples/auth.html && mv examples/index.html.studio examples/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

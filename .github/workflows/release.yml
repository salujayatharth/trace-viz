name: release
# Publishes to npm through trusted publishing (OIDC): no token, no secret.
# The package's npm settings list this repo + this workflow file as a trusted
# publisher. Run it from the Actions tab, or push a tag like v0.3.1. It
# refuses to run if the version in package.json is already on the registry.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older one.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Refuse to republish an existing version
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "trace-viz@$v" version >/dev/null 2>&1; then echo "trace-viz@$v already published"; exit 1; fi
      - run: npm publish --access public --provenance
